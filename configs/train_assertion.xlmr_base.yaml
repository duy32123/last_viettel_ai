{
  "model_name": "FacebookAI/xlm-roberta-base",
  "train_path": "data/processed/assertion/train.jsonl",
  "dev_path": "data/processed/assertion/dev.jsonl",
  "output_dir": "checkpoints/assertion_xlmr_base_v1",
  "max_length": 256,
  "per_device_train_batch_size": 8,
  "per_device_eval_batch_size": 16,
  "gradient_accumulation_steps": 2,
  "learning_rate": 2e-05,
  "epochs": 4,
  "warmup_ratio": 0.1,
  "weight_decay": 0.01,
  "fp16": true,
  "seed": 83,
  "metric_for_best_model": "macro_f1",
  "early_stopping_patience": 2,
  "report_to": "none",
  "save_total_limit": 1,
  "test_path": "data/processed/assertion/test.jsonl",
  "eval_strategy": "epoch",
  "logging_steps": 50
}
