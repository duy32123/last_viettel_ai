name: CI

on:
  pull_request:
  push:
    branches: [main, work, phase-5a-ner-pipeline]
  workflow_dispatch:
    inputs:
      run_integration:
        description: Run optional Hugging Face integration tests
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install unit test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
      - name: Run unit tests
        run: python -m pytest -q -m "not integration"

  integration:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_integration == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install integration dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pip install -r requirements-train.txt
      - name: Run integration tests
        run: python -m pytest -q -m integration
