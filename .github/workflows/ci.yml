name: CI

on:
  pull_request:
  push:
    branches: [main, work, phase-5a-ner-pipeline]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run tests
        run: pytest -q
